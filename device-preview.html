<!doctype html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ludi's 60m — Device Preview</title>
        <link rel="stylesheet" href="src/index.css">
        <link rel="icon" type="image/svg+xml" href="/react_dark.svg">
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100%;
                background: var(--neutral-900);
                background-image:
                    linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
                background-size: 24px 24px;
            }

            .phone-mockup {
                position: relative;
                width: min(400px, 90vw);
                aspect-ratio: 1064 / 2200;
                filter: drop-shadow(0 40px 60px rgba(0, 0, 0, .45));
            }

            @supports (container-type: inline-size) {
                .phone-mockup {
                    container-type: inline-size;
                }
            }

            .phone-screen {
                position: absolute;
                top: 1.64%;
                left: 4.04%;
                width: 91.92%;
                height: 96.68%;
                border-radius: 9cqw;
                overflow: hidden;
                background: #fff;
            }

            .phone-screen iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: none;
            }

            .phone-mockup img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 2;
            }
        </style>
    </head>

    <body>
        <div class="phone-mockup">
            <div class="phone-screen">
                <iframe src="/" title="Ludi's 60m"></iframe>
            </div>
            <img src="/mockup/iphone-frame.png" alt="">
        </div>

        <script>
            const frame = document.querySelector('iframe');
            frame.addEventListener('load', () => {
                try {
                    const doc = frame.contentDocument;
                    const style = doc.createElement('style');
                    style.textContent = '.app{padding-top:7vh!important}.tab-bar{padding-bottom:3vh!important}';
                    doc.head.appendChild(style);
                } catch (e) { }
            });
        </script>
    </body>

</html>
